<!DOCTYPE html>
<html>
    <head>
        <title>sample website</title>
    </head>
    <body>
        <h1>student form</h1>
        <form>
            <table cellpadding="5" cellspacing="10" widht="5">
                <tr>
                    <td>
                    <label for="">ENTER A NAME:</label>
                    </td>
                    <td>
                    <input type="text" name="name">
                    </td>
                </tr>
                <tr>
                    <td>
                    <label for="">ENTER A AGE:</label>
                    </td>
                    <td>
                    <input type="number" name="age" min="18">
                    </td>
                </tr>
                <tr>
                    <td>
                    <label for="">ENTER A EMAIL:</label>
                    </td>
                    <td>
                    <input type="email" name="email">
                    </td>

                </tr>
                <tr>
                    <td>
                    <label for="">ENTER A PASSWORD:</label>
                    </td>
                    <td>
                    <input type="password" name="password" maxlength="10">
                    </td>
                </tr>
                 <tr>
                    <td>
                    <label for="">DATE OF BIRTH:</label>
                    </td>
                    <td>
                    <input type="date" name="dob">
                    </td>
                </tr>
                 <tr>
                    <td>
                    <label for="">GENDER:</label>
                    </td>
                    <td>
                    <input type="radio" name="gender">male
                    <input type="radio" name="gender">female
                    </td>
                    </tr>

                    <tr>
                    <td>
                    <label for="">COURSE:</label>
                    </td>
                    <td>
                    <select>
                        <option value=""></option>
                        <option value="BCS CS">BSC CS</option>
                        <option value="BCA">BCA</option>
                        <option value="BCOM">BCOM</option>
                        <option value="BA TAMIL">BA TAMIL</option>
                    </select>
                    </td>
                    </tr>

                    <tr>
                        <td>
                            <label for="">SKILL:</label>
                        </td>
                        <td>
                            <input type="checkbox" value="html">HTML
                            <input type="checkbox" value="css">CSS
                            <input type="checkbox" value="js">JS
                            <input type="checkbox" value="PYTHON">PYTHON

                        </td>
                    </tr>
                    <tr>
                        <td>
                            <input type="submit">
                            <input type="reset">

                        </td>
                    </tr>
            </table>
        </form>
    </body>
</html>
